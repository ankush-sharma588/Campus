services:
  # ---------- API (Express + MongoDB + Cloudinary) ----------
  - type: web
    name: placehub-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: PlaceHub
      - key: FRONTEND_URL
        value: https://dcrust-campus-placement.vercel.app
      - key: MAIL_FROM_NAME
        value: PlaceHub
      - key: CLIENT_URL        # set to the static site URL below, e.g. https://placehub-web.onrender.com
        sync: false

  # ---------- Frontend (Vite + React static site) ----------
  - type: web
    name: placehub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_BACKEND_URL   # set to the API URL above, e.g. https://placehub-api.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
