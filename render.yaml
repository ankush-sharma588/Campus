services:
  # Express API only. The React/Vite frontend is deployed separately on Vercel.
  - type: web
    name: placehub-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.23.5"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4518
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: OTP_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: PlaceHub
      - key: FRONTEND_URL
        value: https://dcrust-campus-placement.vercel.app
      - key: CLIENT_URL
        sync: false
